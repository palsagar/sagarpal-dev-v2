<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Admin{% endblock %} — Sagar Pal</title>
<style>
  :root {
    --ground: #0a0e16; --surface: #111823; --surface-2: #1a2330; --surface-3: #232e3d;
    --ink: #eeeae2; --ink-2: #a0a8b4; --accent: #f2a64a; --accent-hover: #f6b867;
    --on-accent: #0a0e16; --link: #f2a64a; --danger: #ff8a7a;
    color-scheme: dark;
    --font-sans: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ground: #f3f4f6; --surface: #e7ebef; --surface-2: #dce2e8; --surface-3: #d0d8e0;
      --ink: #111925; --ink-2: #4e5866; --accent: #f2a64a; --accent-hover: #ee9a33;
      --on-accent: #111925; --link: #9a520e; --danger: #a3261a;
      color-scheme: light;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 17px/1.5 var(--font-sans); -webkit-text-size-adjust: 100%;
  }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 32px; line-height: 1.15; margin: 0 0 24px; }
  h2 { font-size: 22px; margin: 40px 0 12px; }
  a { color: var(--link); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
    padding: 0 20px; border-radius: 999px; border: 1px solid var(--surface-3);
    background: var(--surface-2); color: var(--ink); font: inherit; font-weight: 600;
    text-decoration: none; cursor: pointer;
  }
  .btn--primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn--primary:hover { background: var(--accent-hover); }
  .btn--danger { color: var(--danger); }
  .btn--sm { min-height: 36px; padding: 0 14px; font-size: 15px; }
  .inline { display: inline; margin: 0; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  .item { background: var(--surface); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .item__title { font-weight: 600; margin: 0; overflow-wrap: anywhere; }
  .item__meta { color: var(--ink-2); font-size: 15px; margin: 2px 0 10px; overflow-wrap: anywhere; }
  .item__actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { font-size: 13px; padding: 1px 8px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); margin-left: 6px; font-weight: 400; }
  .empty { color: var(--ink-2); }
  form.stack { display: grid; gap: 18px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .hint { color: var(--ink-2); font-size: 14px; font-weight: 400; }
  input[type=text], input[type=url], input[type=number], input[type=date], input[type=password], select, textarea {
    width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--surface-3); background: var(--surface-2); color: var(--ink);
    font: inherit; font-size: 17px;
  }
  textarea { min-height: 96px; resize: vertical; }
  .row { display: grid; gap: 18px; grid-template-columns: 1fr 1fr; }
  .with-button { display: flex; gap: 8px; }
  .with-button input { flex: 1; min-width: 0; }
  .check { display: flex; gap: 10px; align-items: center; font-weight: 600; }
  .check input { width: 22px; height: 22px; }
  .error { color: var(--danger); font-size: 15px; margin: 6px 0 0; }
  .message { background: var(--surface); border-radius: 10px; padding: 12px 16px; margin: 0 0 18px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; }
  @media (max-width: 479.98px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
