{% extends "admin/base.html" %}
{% block title %}Delete permanently{% endblock %}
{% block content %}
<h1>Delete permanently?</h1>
<p>“{{ item.title }}” will be removed for good. This cannot be undone.</p>
<div class="actions">
  <form class="inline" method="post" action="/admin/items/{{ item.id }}/purge">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="btn btn--danger" type="submit">Delete permanently</button>
  </form>
  <a class="btn" href="/admin#deleted">Cancel</a>
</div>
{% endblock %}
